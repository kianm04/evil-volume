<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scream volume</title>
<style>
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    cursor: pointer; touch-action: manipulation;
    width: 800px; height: 400px; overflow: hidden; position: relative;
    background: #23243d; user-select: none;
  }
  #gl { position: absolute; inset: 0; width: 800px; height: 400px; display: block; }
  #ui { position: absolute; left: 350px; right: 20px; top: 0; bottom: 0; perspective: 600px; pointer-events: none; }
  #panel {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; will-change: transform; transform-style: preserve-3d;
  }
  #panel > * { pointer-events: auto; }
  #label { margin: 0; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #cfcce0; text-shadow: 0 2px 6px #000a; }
  #numbox { height: 120px; display: grid; place-items: center; pointer-events: none; will-change: transform; }
  #num { margin: 0; font-size: 56px; font-weight: 700; line-height: 1; will-change: transform; text-shadow: 0 3px 10px #000a; }
  #gauge { width: 360px; height: 14px; background: #15162acc; border-radius: 7px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #6dff9c, #ffd84a 60%, #ff4f6d); }
  #btns { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  #ok { font-size: 13px; background: #3f4168; border-radius: 6px; padding: .3rem .7rem; }
  #mute { position: absolute; top: 8px; right: 8px; z-index: 5; background: #0006; border-radius: 6px; padding: 2px 8px; font-size: 16px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  #dlg {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 6; display: none;
    background: #eceae3; color: #23243d; border-radius: 10px; padding: 18px 26px; text-align: center;
    box-shadow: 0 12px 40px #000a; white-space: nowrap;
  }
  #dlg p { margin: 0 0 12px; }
  #dlg b { font-size: 22px; }
  #dlg button { background: #23243d; color: #eceae3; border-radius: 6px; padding: .3rem 1.1rem; margin: 0 6px; }
  #err { position: absolute; left: 12px; bottom: 8px; font-size: 12px; color: #ffb3c0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="800" height="400"></canvas>
  <div id="ui">
    <div id="panel">
      <p id="label">volume · click anywhere to pump</p>
      <div id="numbox"><p id="num">0%</p></div>
      <div id="gauge"><div id="fill"></div></div>
      <div id="btns">
        <button id="ok">OK</button>
      </div>
    </div>
  </div>
  <div id="dlg">
    <p id="dmsg">set volume to <b id="dv">0%</b> — are you sure?</p>
    <button id="yes">yes</button><button id="no">no</button>
  </div>
  <div id="flash"></div>
  <button id="mute" title="mute">🔊</button>
  <div id="err"></div>
</div>
<script type="module">
  let THREE;
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  } catch (e) {
    document.getElementById('err').textContent = 'could not load three.js (needs internet)';
    throw e;
  }

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const PUMP = 4;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.2 : 1;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  let volume = 0, state = 'play'; // play | popped
  let kick = 0, grow = 1, last = performance.now();
  let hum = 0;               // seconds of "muted" humming left
  let voice = null;          // temporary silly voice {name, label, until, ...params}
  let dialogAsked = null;    // volume when OK was clicked, while the dialog is open
  let mx = 0, my = 0;
  const choir = [];

  // #v=80 freezes the volume there, #v=80&c=6 also adds six choir faces (for screenshots)
  const dbg = /v=(\d+)/.exec(location.hash);
  const dbgChoir = /c=(\d+)/.exec(location.hash);

  const VOICES = [
    { name: 'opera',    label: '♪ it has decided to do opera ♪', pm: 1.0, lr: 6,  ld: 130, fm: 0.85, dr: 0.35, scale: 1.1 },
    { name: 'chipmunk', label: 'it inhaled something',            pm: 2.3, fm: 1.5, dr: 1,   scale: 0.7,  tint: 0xc98a4b },
    { name: 'demon',    label: 'oh no. it found the low notes',   pm: 0.4, fm: 0.72, dr: 2,  scale: 1.3,  tint: 0x5b1a7a },
    { name: 'goat',     label: 'it is a goat now',                pm: 1.15, lr: 13, ld: 260, fm: 1.1, dr: 1, scale: 1, tint: 0xf2f2f2 },
  ];

  // ---------- sound: a synthesised scream, no audio files ----------
  let squish = 0;
  let ac, A, nextCrack = 0, crackUntil = 0, crackMult = 1;
  function initAudio() {
    if (ac) { ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain(); master.gain.value = 0.55;
    const limiter = ac.createDynamicsCompressor(); // keeps "loud" from becoming painful
    limiter.threshold.value = -14; limiter.knee.value = 0; limiter.ratio.value = 20;
    limiter.attack.value = 0.002; limiter.release.value = 0.1;
    limiter.connect(master).connect(ac.destination);

    const lips = ac.createBiquadFilter(); lips.type = 'lowpass'; lips.frequency.value = 18000; lips.connect(limiter);
    const voiceGain = ac.createGain(); voiceGain.gain.value = 0; voiceGain.connect(lips);
    const mix = ac.createGain(); mix.connect(voiceGain);
    const shaper = ac.createWaveShaper(); shaper.oversample = '2x';
    const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) curve[i] = Math.tanh(3 * (i / 511.5 - 1));
    shaper.curve = curve;
    const pre = ac.createGain(); pre.gain.value = 0.4; pre.connect(shaper);

    // three bandpass filters shape the buzz into an "AAAH" vowel
    const formants = [[800, 4, 1], [1400, 5, 0.7], [2900, 6, 0.5]].map(([f, q, g]) => {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const gg = ac.createGain(); gg.gain.value = g;
      shaper.connect(bp).connect(gg).connect(mix);
      return bp;
    });

    const lfo = ac.createOscillator(); lfo.frequency.value = 5;
    const lfoGain = ac.createGain(); lfoGain.gain.value = 8; lfo.connect(lfoGain); lfo.start();
    const oscs = [0, 9, -11].map(d => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.detune.value = d; o.frequency.value = 200;
      lfoGain.connect(o.detune); o.connect(pre); o.start(); return o;
    });

    const nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const nd = nbuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource(); noise.buffer = nbuf; noise.loop = true;
    const nbp = ac.createBiquadFilter(); nbp.type = 'bandpass'; nbp.frequency.value = 2600; nbp.Q.value = 0.8;
    const noiseGain = ac.createGain(); noiseGain.gain.value = 0;
    noise.connect(nbp).connect(noiseGain).connect(mix); noise.start();

    const sub = ac.createOscillator(); sub.type = 'square'; sub.frequency.value = 170;
    const subGain = ac.createGain(); subGain.gain.value = 0;
    lfoGain.connect(sub.detune); sub.connect(subGain).connect(pre); sub.start();

    A = { sub, subGain, master, limiter, lips, voiceGain, pre, formants, lfo, lfoGain, oscs, noiseGain, nbuf };
    choir.forEach(addChoirOsc);
  }

  function addChoirOsc(c) {
    if (!ac || c.osc) return;
    c.osc = ac.createOscillator(); c.osc.type = 'sawtooth'; c.osc.frequency.value = 200 * c.ratio;
    c.gain = ac.createGain(); c.gain.gain.value = 0.3;
    A.lfoGain.connect(c.osc.detune);
    c.osc.connect(c.gain).connect(A.pre); c.osc.start();
  }

  function updateAudio(v) {
    if (!ac) return;
    const t = ac.currentTime, on = state === 'play' && v > 0.005;
    const V = voice || {};
    // pitch climbs from ~340 Hz to ~600 Hz by 50%, then nearly levels off (~640 Hz at 100%).
    // past 50% it gets sillier instead of higher: voice cracks, a "wah-wah" mouth and a growl underneath.
    const wobble = 1 + Math.sin(t * 23) * Math.sin(t * 7.3) * 0.04 * v;
    const over = Math.max(0, v - 0.5) * 2; // 0 at 50% .. 1 at 100%
    if (over > 0 && on && !hum && t > nextCrack) {
      crackUntil = t + rnd(0.08, 0.22);
      crackMult = pick([1.5, 2, 2, 0.5]); // yodel up a fifth or an octave, or drop one
      nextCrack = t + rnd(0.5, 2) / (0.5 + over);
    }
    const cracking = t < crackUntil;
    const f = 340 * Math.pow(2, 1.63 * Math.min(v, 0.5) + 0.2 * Math.max(0, v - 0.5)) * wobble * (cracking ? crackMult : 1) * (V.pm || 1);
    A.oscs.forEach(o => o.frequency.setTargetAtTime(f, t, cracking ? 0.008 : 0.03));
    A.sub.frequency.setTargetAtTime(f / 2, t, 0.03);
    A.subGain.gain.setTargetAtTime(on ? over * 0.5 : 0, t, 0.08);
    choir.forEach(c => c.osc && c.osc.frequency.setTargetAtTime(f * c.ratio, t, 0.05));
    A.lfo.frequency.setTargetAtTime(V.lr || 5 + 7 * v, t, 0.05);
    A.lfoGain.gain.setTargetAtTime(V.ld || 8 + 70 * v * v, t, 0.05);
    A.pre.gain.setTargetAtTime((0.4 + 2.2 * v) * (V.dr || 1), t, 0.05);
    const fm = V.fm || 1;
    const wah = 1 + Math.sin(t * (9 + 14 * over)) * 0.4 * over; // mouth flaps open and shut
    A.formants[0].frequency.setTargetAtTime((850 + 250 * v) * wah * fm, t, 0.02);
    A.formants[1].frequency.setTargetAtTime(1500 * fm, t, 0.05);
    A.formants[2].frequency.setTargetAtTime(3000 * fm, t, 0.05);
    A.noiseGain.gain.setTargetAtTime(on && !hum ? v * v * v * 0.3 : 0, t, 0.05);
    A.lips.frequency.setTargetAtTime(hum ? 320 : 18000, t, 0.03); // "muted" = humming through closed lips
    A.voiceGain.gain.setTargetAtTime(on ? Math.pow(Math.min(1, v), 1.3) * 0.9 : 0, t, 0.04);
  }

  function popSound() {
    if (!ac) return;
    const t = ac.currentTime;
    const n = ac.createBufferSource(); n.buffer = A.nbuf;
    const g = ac.createGain(); g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    n.connect(g).connect(A.limiter); n.start(t); n.stop(t + 0.45);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    const og = ac.createGain(); og.gain.setValueAtTime(1, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(og).connect(A.limiter); o.start(t); o.stop(t + 0.4);
  }

  function fallSound() { // slide whistle going down
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(1300, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.6);
    const g = ac.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.setValueAtTime(0.5, t + 0.5); g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
    o.connect(g).connect(A.limiter); o.start(t); o.stop(t + 0.7);
  }

  function thud(strength) {
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.25);
    const og = ac.createGain(); og.gain.setValueAtTime(1.2 * strength, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(og).connect(A.limiter); o.start(t); o.stop(t + 0.4);
    const n = ac.createBufferSource(); n.buffer = A.nbuf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.8 * strength, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    n.connect(lp).connect(ng).connect(A.limiter); n.start(t); n.stop(t + 0.2);
  }

  function sadTrombone() { // wah, wah, wah, waaaah
    if (!ac) return;
    const t0 = ac.currentTime + 0.35;
    [233, 220, 208, 196].forEach((f, i) => {
      const t = t0 + i * 0.4, dur = i === 3 ? 1.2 : 0.34;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * (i === 3 ? 0.88 : 0.97), t + dur);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 4;
      lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(1300, t + 0.08); lp.frequency.linearRampToValueAtTime(450, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.03);
      g.gain.setValueAtTime(0.5, t + dur - 0.08); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(lp).connect(g).connect(A.limiter); o.start(t); o.stop(t + dur + 0.05);
    });
  }

  function whineSound() { // the half second before it blows
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(3200, t + 0.5);
    const g = ac.createGain(); g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0.5, t + 0.48); g.gain.linearRampToValueAtTime(0, t + 0.52);
    o.connect(g).connect(A.limiter); o.start(t); o.stop(t + 0.55);
  }

  function boomSound() {
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(24, t + 1.3);
    const og = ac.createGain(); og.gain.setValueAtTime(2, t); og.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
    o.connect(og).connect(A.limiter); o.start(t); o.stop(t + 1.7);
    const n = ac.createBufferSource(); n.buffer = A.nbuf; n.loop = true;        // rumble
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(90, t + 1.8);
    const ng = ac.createGain(); ng.gain.setValueAtTime(2, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
    n.connect(lp).connect(ng).connect(A.limiter); n.start(t); n.stop(t + 2.3);
    const c = ac.createBufferSource(); c.buffer = A.nbuf;                        // the crack on top
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    const cg = ac.createGain(); cg.gain.setValueAtTime(1.5, t); cg.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    c.connect(hp).connect(cg).connect(A.limiter); c.start(t); c.stop(t + 0.15);
  }

  function ding() {
    if (!ac) return;
    const t = ac.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.4, t + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.9);
      o.connect(g).connect(A.limiter); o.start(t); o.stop(t + 1.2);
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (ac) document.hidden ? ac.suspend() : ac.resume();
  });

  // ---------- 3D scene ----------
  const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(800, 400, false);
  const scene = new THREE.Scene();
  const BG0 = new THREE.Color(0x23243d), BG1 = new THREE.Color(0x960e28);
  scene.background = BG0.clone();
  scene.fog = new THREE.Fog(0x23243d, 9, 24);
  const camera = new THREE.PerspectiveCamera(40, 2, 0.1, 100);
  camera.position.set(0, 0.3, 7);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x333355, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 4, 5); scene.add(sun);
  const panic = new THREE.PointLight(0xff2244, 0, 30); panic.position.set(-1, 0.5, 3.5); scene.add(panic);

  const boomLight = new THREE.PointLight(0xffaa44, 0, 40); scene.add(boomLight);
  const grid = new THREE.GridHelper(80, 80, 0xff4f6d, 0x55588f);
  grid.position.y = -2.1; scene.add(grid);

  const sphere = new THREE.SphereGeometry(1, 40, 28);
  const box = new THREE.BoxGeometry(1, 1, 1);
  const SKIN = new THREE.Color(0xffd9a8), RED = new THREE.Color(0xff4533), TMP = new THREE.Color();
  const mats = {
    white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 }),
    pupil: new THREE.MeshStandardMaterial({ color: 0x14141f, roughness: 0.2 }),
    brow: new THREE.MeshStandardMaterial({ color: 0x3a2a22, roughness: 0.8 }),
    mouth: new THREE.MeshBasicMaterial({ color: 0x2a0509 }),
    tongue: new THREE.MeshStandardMaterial({ color: 0xe8506a, roughness: 0.5 }),
  };

  function makeHead() {
    const g = new THREE.Group();
    const skin = new THREE.MeshStandardMaterial({ color: 0xffd9a8, roughness: 0.5 });
    const ball = new THREE.Mesh(sphere, skin); g.add(ball);
    const eyes = [-1, 1].map(s => {
      const eye = new THREE.Mesh(sphere, mats.white); eye.position.set(0.36 * s, 0.28, 0.84); g.add(eye);
      const pupil = new THREE.Mesh(sphere, mats.pupil); pupil.position.z = 0.8; eye.add(pupil);
      const brow = new THREE.Mesh(box, mats.brow); brow.scale.set(0.44, 0.09, 0.1); g.add(brow);
      const xg = new THREE.Group(); xg.position.set(0.36 * s, 0.28, 0.93); xg.visible = false; g.add(xg);
      [0.785, -0.785].forEach(r => { const b = new THREE.Mesh(box, mats.pupil); b.scale.set(0.34, 0.08, 0.06); b.rotation.z = r; xg.add(b); });
      return { eye, pupil, brow, s, xg };
    });
    const mouthG = new THREE.Group(); g.add(mouthG);
    const mouth = new THREE.Mesh(sphere, mats.mouth); mouthG.add(mouth);
    const tongue = new THREE.Mesh(sphere, mats.tongue); tongue.position.z = 0.1; mouthG.add(tongue);
    const teeth = new THREE.Mesh(box, mats.white); teeth.position.z = 0.14; mouthG.add(teeth);

    // e: 0 calm .. 1 full scream
    g.userData.update = (e, closed, tint, dead) => {
      skin.color.copy(SKIN).lerp(RED, closed ? Math.min(1, e + 0.3) : e);
      if (tint) skin.color.lerp(TMP.set(tint), 0.65);
      ball.scale.x = closed ? 1.16 : 1; // puffed cheeks
      for (const { eye, pupil, brow, s, xg } of eyes) {
        eye.visible = !dead; xg.visible = !!dead;
        eye.scale.setScalar(0.2 * (1 + 0.7 * e));
        eye.position.z = 0.84 + 0.14 * e;
        pupil.scale.setScalar(0.45 * (1 - 0.5 * e));
        pupil.position.x = (Math.random() - 0.5) * 0.3 * e * e;
        pupil.position.y = (Math.random() - 0.5) * 0.3 * e * e;
        brow.position.set(0.36 * s, 0.6 + 0.24 * e, 0.86 - 0.1 * e);
        brow.rotation.z = -s * 0.5 * e; // inner ends go up: worried
      }
      const rx = closed ? 0.2 : 0.22 + 0.2 * e, ry = closed ? 0.025 : dead ? 0.06 : 0.03 + 0.45 * e;
      const phi = 0.38 + 0.12 * e;
      mouthG.position.set(0, -Math.sin(phi) * 0.9, Math.cos(phi) * 0.9);
      mouthG.rotation.x = phi;
      mouth.scale.set(rx, ry, 0.2);
      tongue.position.y = -ry * 0.5; tongue.scale.set(rx * 0.55, ry * 0.38, 0.14);
      teeth.position.y = ry * 0.72; teeth.scale.set(rx, ry * 0.24, 0.12);
      teeth.visible = tongue.visible = ry > 0.1;
    };
    return g;
  }

  // a rainbow cat that flies past in the background once it gets loud
  const cat = new THREE.Group(); cat.visible = false; cat.position.set(-13, 1.2, -5); scene.add(cat);
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const fur = new THREE.MeshStandardMaterial({ color: 0xff9a3c, roughness: 0.7 });
  const part = (mat, px, py, pz, sx, sy, sz, parent = cat) => {
    const m = new THREE.Mesh(box, mat); m.position.set(px, py, pz); m.scale.set(sx, sy, sz); parent.add(m); return m;
  };
  part(fur, 0, 0, 0, 1.2, 0.7, 0.6);                               // body
  part(mats.white, 0, -0.2, 0.02, 0.9, 0.32, 0.62);                // belly
  part(fur, 0.8, 0.1, 0, 0.62, 0.56, 0.66);                        // head
  part(fur, 0.62, 0.46, 0, 0.16, 0.2, 0.5); part(fur, 0.98, 0.46, 0, 0.16, 0.2, 0.5); // ears
  part(mats.pupil, 0.7, 0.16, 0.34, 0.09, 0.12, 0.02); part(mats.pupil, 0.96, 0.16, 0.34, 0.09, 0.12, 0.02); // eyes
  part(flat(0xff7aa8), 0.83, 0.02, 0.34, 0.08, 0.06, 0.02);        // nose
  const catTail = part(fur, -0.75, 0.2, 0, 0.5, 0.14, 0.14);
  const catLegs = [-0.42, -0.14, 0.18, 0.46].map(x => part(fur, x, -0.45, 0, 0.16, 0.3, 0.3));
  const trail = [];
  [0xff2b2b, 0xff9a1f, 0xffe92b, 0x35e04a, 0x2b9bff, 0x8b4dff].forEach((c, row) => {
    const mat = flat(c);
    for (let i = 0; i < 16; i++) trail.push({ m: part(mat, -0.8 - i * 0.4, 0, -0.1, 0.4, 0.12, 0.3), i, y: 0.3 - row * 0.12 });
  });

  const main = makeHead();
  const MAIN_POS = new THREE.Vector3(-2.35, 0.15, 0);
  main.position.copy(MAIN_POS); scene.add(main);

  // exploding bits
  const bits = [];
  const bitMats = [0xff4533, 0xffd9a8, 0xffffff, 0xe8506a, 0xffd84a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
  function burst(pos, n, size, power = 1) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(sphere, pick(bitMats));
      m.position.copy(pos); m.scale.setScalar(rnd(0.05, 0.2) * size);
      const a = rnd(0, Math.PI * 2), b = rnd(-1, 1), sp = rnd(3, 11) * power;
      m.userData.vel = new THREE.Vector3(Math.cos(a) * Math.sqrt(1 - b * b), b + 0.4, Math.sin(a) * Math.sqrt(1 - b * b)).multiplyScalar(sp);
      m.userData.life = rnd(0.9, 1.7);
      scene.add(m); bits.push(m);
    }
  }

  // ---------- the choir ----------
  function addChoir() {
    if (choir.length >= 12) return;
    const c = {
      head: makeHead(),
      pos: new THREE.Vector3(rnd(-4.8, 4.8), rnd(-1.3, 2.1), rnd(-7, -0.8)),
      size: rnd(0.3, 0.62), phase: rnd(0, 10), age: 0, dying: 0,
      ratio: pick([0.5, 0.75, 1.25, 1.5, 2]) * rnd(0.97, 1.03), // each one slightly out of tune
    };
    c.head.position.copy(c.pos); c.head.scale.setScalar(0.001);
    scene.add(c.head); choir.push(c); addChoirOsc(c);
  }
  function removeChoir(c) {
    scene.remove(c.head);
    if (c.osc) { c.osc.stop(); c.osc.disconnect(); c.gain.disconnect(); }
    choir.splice(choir.indexOf(c), 1);
  }

  // ---------- behaviour ----------
  // the end: at 100% it swells up, detonates, and what's left of him lands on the floor. click to revive.
  let deadT = 0, fallV = 0, landed = false, exploded = false, spin = 0, blast = 0, catBlast = false, smokeAt = 0;
  const fx = []; // fireballs, shockwaves, smoke
  const ringGeo = new THREE.RingGeometry(0.86, 1, 64);
  function addFx(color, pos, s0, s1, life, op, o = {}) {
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: op, depthWrite: false, fog: false, side: THREE.DoubleSide,
      blending: o.smoke ? THREE.NormalBlending : THREE.AdditiveBlending,
    });
    const m = new THREE.Mesh(o.ring ? ringGeo : sphere, mat);
    m.position.copy(pos); m.scale.setScalar(s0);
    if (o.flat) m.rotation.x = -Math.PI / 2;
    scene.add(m);
    fx.push({ m, s0, s1, life, max: life, op, vel: o.vel || null });
  }
  function die() {
    state = 'dead'; volume = 0; voice = null; hum = 0; deadT = 0; landed = false; exploded = false;
    $('mute').textContent = '🔊';
    $('label').textContent = 'volume · uh oh';
    whineSound();
  }
  function explode() {
    exploded = true; fallV = 10; spin = 0; blast = 1; kick = 1.8;
    boomSound();
    $('flash').animate([{ opacity: 1 }, { opacity: 0.9, offset: 0.15 }, { opacity: 0 }], { duration: 1100 });
    const p = main.position.clone();
    burst(p, 160, 1.2, 1.9);
    [...choir].forEach(c => { burst(c.pos, 10, c.size, 1.5); addFx(0xff9a1f, c.pos, 0.2, 2.5, 0.6, 0.9); removeChoir(c); });
    addFx(0xffffff, p, 0.5, 10, 0.55, 1);                                    // the big one
    for (let i = 0; i < 18; i++) {
      const off = new THREE.Vector3(rnd(-1.8, 1.8), rnd(-1.2, 1.8), rnd(-1, 1.5));
      addFx(pick([0xffe066, 0xff9a1f, 0xff4a1f, 0xffffff, 0xff2b2b]), p.clone().add(off), 0.3, rnd(2, 5.5), rnd(0.5, 1.3), 0.9,
        { vel: off.clone().multiplyScalar(rnd(0.8, 2)) });
    }
    addFx(0xffd9a0, new THREE.Vector3(p.x, -2.05, p.z), 0.5, 34, 1.1, 1, { ring: true, flat: true }); // shockwave along the floor
    addFx(0xffffff, p, 0.5, 16, 0.7, 0.9, { ring: true });
    addFx(0xff7a2b, p, 0.3, 10, 0.95, 0.7, { ring: true });
    if (cat.visible) catBlast = true;
    $('label').textContent = 'volume · click to revive';
  }
  function revive() {
    state = 'play'; grow = 0;
    $('label').textContent = 'volume · click anywhere to pump';
  }

  // no pump button: clicking anywhere on the stage (or pressing space) pumps
  function pump() {
    initAudio();
    if (state === 'dead') { if (landed && deadT > 2) revive(); return; }
    squish = 1;
    if (state !== 'play') return;
    volume += PUMP;
    if (volume > 100) { die(); return; }
    const v = volume / 100;
    if (v > 0.2 && Math.random() < 0.18 + 0.3 * v) addChoir();
    if (v > 0.25 && !voice && !hum && Math.random() < 0.1) {
      voice = { ...pick(VOICES), until: performance.now() + rnd(3000, 4500) };
    }
  }

  // the mute button only makes it hold the scream in. pressure builds. then it comes back out.
  $('mute').addEventListener('click', () => {
    initAudio();
    if (state !== 'play' || hum) return;
    hum = 2.6; voice = null;
    $('mute').textContent = '🤐';
  });

  // the OK button asks you to confirm a number that is still leaking
  $('ok').addEventListener('click', () => {
    initAudio();
    dialogAsked = Math.round(Math.min(100, volume));
    $('dmsg').innerHTML = 'set volume to <b id="dv"></b> — are you sure?';
    $('yes').style.display = $('no').style.display = '';
    $('dlg').style.display = 'block';
  });
  $('no').addEventListener('click', () => { dialogAsked = null; $('dlg').style.display = 'none'; });
  $('yes').addEventListener('click', () => {
    const got = Math.round(Math.min(100, volume));
    ding();
    dialogAsked = null;
    $('dmsg').textContent = `✔ saved as ${got}%.`;
    $('yes').style.display = $('no').style.display = 'none';
    setTimeout(() => { $('dlg').style.display = 'none'; }, 1600);
  });

  // space bar pumps too
  addEventListener('keydown', ev => {
    if (ev.code === 'Space' && !ev.repeat && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); pump(); }
  });

  stage.addEventListener('pointerdown', ev => {
    if (!ev.target.closest('button, #dlg')) pump();
  });

  stage.addEventListener('pointermove', ev => {
    const r = stage.getBoundingClientRect();
    mx = ((ev.clientX - r.left) / r.width) * 2 - 1;
    my = ((ev.clientY - r.top) / r.height) * 2 - 1;
  });

  // ---------- per-frame ----------
  function updateUI(v, e, now) {
    const shown = Math.round(Math.min(100, volume));
    $('num').textContent = shown + '%';
    const ab = e * e * 7;
    $('num').style.transform = `scale(${1 + 1.1 * e})`;
    $('num').style.textShadow = ab > 0.3 ? `${ab}px 0 #ff2bd6, ${-ab}px 0 #2be4ff, 0 3px 10px #000a` : '';
    $('fill').style.width = Math.min(100, volume) + '%';
    if (dialogAsked !== null) $('dv').textContent = shown + '%';

    // the panel tilts in 3D and rattles
    const amp = (e * e * 6 + kick * 12) * calm;
    $('numbox').style.transform =
      `translate(${(Math.random() - 0.5) * 2 * amp}px,${(Math.random() - 0.5) * 2 * amp}px) ` +
      `rotateY(${-14 + Math.sin(now / 300) * 10 * e * calm}deg) rotateX(${Math.sin(now / 410) * 8 * e * calm}deg)`;
  }

  function update3D(v, e, dt, t) {
    const mood = Math.pow(e, 1.5);
    scene.background.copy(BG0).lerp(BG1, mood);
    scene.fog.color.copy(scene.background);
    panic.intensity = 60 * e * e * (0.7 + 0.3 * Math.sin(t * 30));
    grid.position.z = (t * (1 + 14 * e)) % 1;

    // main head
    if (state === 'dead' && !exploded) {
      // swells up, glowing, about to blow
      deadT += dt;
      const k = Math.min(1, deadT / 0.5);
      main.scale.setScalar(1.4 * (1 + 0.9 * k * k));
      main.position.set(MAIN_POS.x + (Math.random() - 0.5) * 0.3 * k, MAIN_POS.y + (Math.random() - 0.5) * 0.3 * k, 0);
      main.userData.update(1, false, k > 0.5 ? 0xffffee : 0, false);
      if (k >= 1) explode();
    } else if (state === 'dead') {
      // the charred head is thrown up, spins, and lands on the floor
      const FLOOR = -1.0;
      deadT += dt; fallV -= 20 * dt;
      main.position.y += fallV * dt;
      if (!landed) { main.position.x = Math.min(MAIN_POS.x + 1.3, main.position.x + 1.4 * dt); spin -= 10 * dt; }
      else { const rest = Math.round((spin + 1.5) / (Math.PI * 2)) * Math.PI * 2 - 1.5; spin += (rest - spin) * Math.min(1, dt * 10); }
      if (main.position.y < FLOOR) {
        main.position.y = FLOOR;
        if (fallV < -2) { thud(Math.min(1, -fallV / 9)); kick = Math.max(kick, 0.5); if (!landed) { landed = true; sadTrombone(); } fallV *= -0.35; }
        else fallV = 0;
      }
      if (landed && t > smokeAt) { // it smoulders
        smokeAt = t + 0.22;
        addFx(0x1a1a1a, main.position.clone().add(new THREE.Vector3(rnd(-0.5, 0.5), 0.8, 0.3)), 0.25, rnd(0.8, 1.5), 2.2, 0.55,
          { smoke: true, vel: new THREE.Vector3(rnd(-0.2, 0.2), rnd(0.9, 1.5), 0) });
      }
      main.scale.setScalar(1.12);
      main.rotation.set(0, 0.25, spin);
      main.userData.update(0, false, 0x1c1c1c, true);
    } else {
    grow = Math.min(1, grow + dt * 3);
    const V = voice || {};
    const pulse = 1 + Math.sin(t * 40) * 0.03 * e;
    main.scale.setScalar(1.3 * (0.86 + 0.22 * e) * (V.scale || 1) * pulse * (grow * (2 - grow)));
    squish = Math.max(0, squish - dt * 7);
    main.scale.y *= 1 - 0.18 * squish; main.scale.x *= 1 + 0.12 * squish; // squashes on each pump
    const j = e * e * 0.12 * calm + (hum ? 0.05 : 0);
    main.position.set(MAIN_POS.x + (Math.random() - 0.5) * j, MAIN_POS.y + (Math.random() - 0.5) * j, MAIN_POS.z);
    main.rotation.y = 0.25 + mx * 0.5 + Math.sin(t * 1.7) * 0.25 * e;
    main.rotation.x = my * 0.3 - 0.3 * e + Math.sin(t * 2.3) * 0.1 * e; // head tips back to scream
    main.rotation.z = Math.sin(t * 31) * 0.12 * e * e * calm;
    main.userData.update(e, hum > 0, V.tint);
    }

    // choir
    for (const c of [...choir]) {
      c.age += dt;
      if (c.dying) { c.dying -= dt; if (c.dying <= 0) { removeChoir(c); continue; } }
      const inS = Math.min(1, c.age * 4), outS = c.dying ? c.dying / 0.25 : 1;
      c.head.scale.setScalar(Math.max(0.001, c.size * (inS * (2.2 - 1.2 * inS)) * outS));
      c.head.position.set(c.pos.x + Math.sin(t * 1.3 + c.phase) * 0.3, c.pos.y + Math.sin(t * 3 + c.phase) * 0.25, c.pos.z);
      c.head.rotation.set(Math.sin(t * 2.1 + c.phase) * 0.3 - 0.2 * e, Math.sin(t * 1.6 + c.phase) * 0.7, Math.sin(t * 2.7 + c.phase) * 0.3);
      c.head.userData.update(Math.max(0.15, e * (0.75 + 0.25 * Math.sin(t * 6 + c.phase))), hum > 0, null);
    }

    // rainbow cat: shows up above 30% and flies faster the louder it gets
    if (v > 0.3 && !cat.visible) { cat.visible = true; cat.position.x = -13; cat.position.y = rnd(0.2, 2.2); }
    if (cat.visible) {
      cat.position.x += (3 + 9 * e) * dt;
      if (cat.position.x > 20) { cat.visible = false; catBlast = false; cat.rotation.x = 0; }
      const bob = Math.sin(t * 9) * 0.12;
      cat.position.z = -5;
      cat.rotation.z = Math.sin(t * 9) * 0.06;
      catTail.rotation.z = Math.sin(t * 12) * 0.5;
      catLegs.forEach((l, k) => { l.rotation.z = Math.sin(t * 14 + k * 1.6) * 0.5; });
      for (const s of trail) s.m.position.y = s.y + bob + (Math.floor(t * 8 + s.i) % 2 ? 0.07 : -0.07);
    }

    // explosion: fireballs, shockwaves, smoke, and the light from it
    blast = Math.max(0, blast - dt * 1.1);
    scene.background.lerp(TMP.set(0xff8a2b), blast * 0.85);
    scene.fog.color.copy(scene.background);
    boomLight.intensity = 900 * blast; boomLight.position.copy(MAIN_POS).z = 2;
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.life -= dt;
      const k = 1 - Math.max(0, f.life) / f.max, ease = 1 - (1 - k) * (1 - k);
      f.m.scale.setScalar(f.s0 + (f.s1 - f.s0) * ease);
      f.m.material.opacity = f.op * (1 - k);
      if (f.vel) f.m.position.addScaledVector(f.vel, dt);
      if (f.life <= 0) { scene.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); }
    }
    if (catBlast) { // the cat gets blown away too
      cat.position.y += 7 * dt; cat.rotation.x += 14 * dt;
      if (cat.position.y > 7) { cat.visible = false; catBlast = false; cat.rotation.x = 0; }
    }

    // bits
    for (let i = bits.length - 1; i >= 0; i--) {
      const m = bits[i];
      m.userData.vel.y -= 14 * dt;
      m.position.addScaledVector(m.userData.vel, dt);
      m.userData.life -= dt;
      if (m.userData.life < 0.3) m.scale.multiplyScalar(0.85);
      if (m.userData.life <= 0) { scene.remove(m); bits.splice(i, 1); }
    }

    // camera pushes in and shakes
    const sh = (e * e * 0.1 + kick * 0.35) * calm;
    camera.position.set((Math.random() - 0.5) * sh + mx * 0.3, 0.3 + (Math.random() - 0.5) * sh - my * 0.15, 7 - 0.9 * e);
    camera.rotation.z = (Math.random() - 0.5) * sh * 0.25;
  }

  let choirCull = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (state === 'play') {
      const v = volume / 100;
      if (hum) {
        volume += 7 * dt; // pressure builds while it holds it in
        hum = Math.max(0, hum - dt);
        if (!hum) { volume += 12; kick = 0.7; $('mute').textContent = '🔊'; }
        if (volume > 100) die();
      } else if (!dbg) {
        volume = Math.max(0, volume - (3 + 14 * v * v) * dt); // leaks faster the louder it is
      }
    }
    if (voice && now > voice.until) voice = null;
    // the choir drifts off once it goes quiet
    choirCull -= dt;
    if (volume < 6 && choirCull <= 0 && !dbgChoir) {
      const c = choir.find(c => !c.dying);
      if (c) { c.dying = 0.25; choirCull = 0.2; }
    }
    kick = Math.max(0, kick - dt * 2.5);

    const v = volume / 100, e = Math.min(1, v);
    updateAudio(v);
    update3D(v, e, dt, now / 1000);
    updateUI(v, e, now);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  if (dbg) volume = +dbg[1];
  if (dbg && volume > 30) { cat.visible = true; cat.position.x = 1.5; }
  if (dbgChoir) for (let i = 0; i < +dbgChoir[1]; i++) addChoir();
  if (/dead/.test(location.hash)) die();
  requestAnimationFrame(frame);
</script>
</body>
</html>
